[project]
name = "dktools"
version = "0.1.0"
description = "datakit platform automation: allocation-ownership audit, isolated verify builds, the validate matrix, the leakage gate, vendored-dependency sync and perf comparison"
readme = "README.md"
authors = [
    { name = "Matt Stancliff", email = "matt@genges.com" }
]
requires-python = ">=3.12"
dependencies = [
    "git-filter-repo>=2.47.0",
    "libclang>=18.1.1",
    "ruff>=0.17.2",
]

[project.scripts]
dktools = "dktools.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
